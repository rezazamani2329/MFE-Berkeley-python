# .isort.cfg — Configuration file for isort, the Python import sorter.
#
# isort automatically organises import statements into a consistent order
# and grouping every time it runs. This file ensures isort's behaviour
# stays compatible with the other tools in the project (black, flake8).
#
# Run isort manually with:   isort .
# Or via the Makefile with:  make lint

[settings]

# Use the "black" compatibility profile.
# This pre-configures isort to match black's expectations for import formatting
# (e.g. multi-line import style, trailing commas), so the two tools never
# produce conflicting output and cause an endless reformat loop.
profile = black

# Maximum line length for import statements before isort wraps them.
# Set to 100 to match black (--line-length=100) and flake8 (max-line-length = 100),
# keeping all three tools consistent with each other.
line_length = 100

# Tells isort that "app" is a first-party module (i.e. our own code).
# isort groups imports into three sections — stdlib, third-party, first-party —
# and adds a blank line between each group. Without this setting, isort would
# not know whether "app" belongs to our project or is a third-party package,
# and might place it in the wrong group.
known_first_party = app
